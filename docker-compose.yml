version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clinician-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-clinician_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinician-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: clinician-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-clinician_db}
      REDIS_URL: redis://redis:6379
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./adaptive-level-forge-main
      dockerfile: Dockerfile
    container_name: clinician-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./adaptive-level-forge-main/src:/app/src
    command: npm run dev

  ml-service:
    build:
      context: ./adaptive-level-forge-main/rl_service
      dockerfile: Dockerfile
    container_name: clinician-ml
    ports:
      - "5001:5000"
    environment:
      FLASK_ENV: development
    volumes:
      - ./adaptive-level-forge-main/rl_service:/app

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: clinician-network
